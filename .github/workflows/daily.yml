name: daily-reel
on:
  schedule:
    - cron: "30 2 * * *"    # 11:30 JST に起動 → 12:00〜13:00 のランダムな時刻(1分単位)まで待って投稿
    - cron: "30 10 * * *"   # 19:30 JST に起動 → 20:00〜21:00 のランダムな時刻(1分単位)まで待って投稿
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら動画とサムネを作るだけ(投稿・公開しない)"
        default: "false"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg 
          pip install -r requirements.txt
      - run: |
          mkdir -p output
          python src/prepare.py output/script.json
          python src/render.py output/script.json assets/bg.mp4 output/reel.mp4
          python src/thumbnail.py output/script.json output/cover.jpg
      - name: Check Instagram token (no posting)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: python src/check_token.py
      - name: Upload test files
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            output/reel.mp4
            output/cover.jpg
            output/script.json
      - name: Release
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: rel
        run: |
          TAG="reel-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" output/reel.mp4 output/cover.jpg --title "$TAG" --notes ""
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/reel.mp4" >> $GITHUB_OUTPUT
          echo "cover=https://github.com/${{ github.repository }}/releases/download/$TAG/cover.jpg" >> $GITHUB_OUTPUT
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python src/wait_until.py output/script.json
      - if: ${{ github.event.inputs.dry_run != 'true' }}
        run: python src/post.py "${{ steps.rel.outputs.url }}" output/script.json "${{ steps.rel.outputs.cover }}"
      - name: Save history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          python - <<'PY'
          import json, datetime
          from zoneinfo import ZoneInfo
          s = json.load(open("output/script.json", encoding="utf-8")); t = s["theme"]
          open("data/daily_log.csv", "a", encoding="utf-8").write(f"{datetime.datetime.now(ZoneInfo('Asia/Tokyo')).date()} {s['post_time']},{t},,\n")  # 日付 時刻,タイトル,ビュー数(あとで記入),備考
          PY
          git add history.json data/daily_log.csv && git commit -m "history" && git push || true
