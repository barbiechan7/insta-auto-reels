name: daily-reel
on:
  schedule:
    - cron: "0 10 * * *"   # 19:00 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
          pip install -r requirements.txt
      - run: |
          mkdir -p output
          python src/generate.py output/script.json
          python src/render.py output/script.json assets/bg.mp4 output/reel.mp4
      - name: Release
        id: rel
        run: |
          TAG="reel-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" output/reel.mp4 --title "$TAG" --notes ""
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/reel.mp4" >> $GITHUB_OUTPUT
      - run: python src/post.py "${{ steps.rel.outputs.url }}" output/script.json
      - name: Save history
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add history.json && git commit -m "history" && git push || true
