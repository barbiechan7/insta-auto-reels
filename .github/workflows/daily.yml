name: daily-reel
on:
  schedule:
    # 昼枠(12:00〜13:00に投稿)。GitHubの定期実行は遅れることがあるので、2回起動して保険にする(二重投稿は prepare.py が防ぐ)
    - cron: "0 2 * * *"     # 11:00 JST
    - cron: "30 2 * * *"    # 11:30 JST
    # 夜枠(20:00〜21:00に投稿)
    - cron: "0 10 * * *"    # 19:00 JST
    - cron: "30 10 * * *"   # 19:30 JST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true なら動画とサムネを作るだけ(投稿・公開しない)"
        default: "false"
permissions:
  contents: write
concurrency:
  group: reel
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Prepare script
        id: prep
        run: |
          mkdir -p output
          python src/prepare.py output/script.json
      - name: Render video and cover
        if: steps.prep.outputs.skip != 'true'
        run: |
          python src/render.py output/script.json assets/bg.mp4 output/reel.mp4
          python src/thumbnail.py output/script.json output/cover.jpg
      - name: Check Instagram token (no posting)
        if: steps.prep.outputs.skip != 'true' && github.event.inputs.dry_run == 'true'
        run: python src/check_token.py
      - name: Upload test files
        if: steps.prep.outputs.skip != 'true' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run
          path: |
            output/reel.mp4
            output/cover.jpg
            output/script.json
      - name: Release
        id: rel
        if: steps.prep.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          TAG="reel-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" output/reel.mp4 output/cover.jpg --title "$TAG" --notes ""
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/reel.mp4" >> $GITHUB_OUTPUT
          echo "cover=https://github.com/${{ github.repository }}/releases/download/$TAG/cover.jpg" >> $GITHUB_OUTPUT
      - name: Wait until post time
        if: steps.prep.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: python src/wait_until.py output/script.json
      - name: Post to Instagram
        if: steps.prep.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: python src/post.py "${{ steps.rel.outputs.url }}" output/script.json "${{ steps.rel.outputs.cover }}"
      - name: Save history
        if: steps.prep.outputs.skip != 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          python - <<'PY'
          import json, datetime
          from zoneinfo import ZoneInfo
          s = json.load(open("output/script.json", encoding="utf-8"))
          now = datetime.datetime.now(ZoneInfo("Asia/Tokyo"))
          open("data/daily_log.csv", "a", encoding="utf-8").write(f"{now.date()} {s['post_time']}(実際{now:%H:%M}),{s['theme']},,,{open('output/posted_id.txt').read().strip()}\n")  # 日付 予定時刻(実際の投稿時刻),タイトル,ビュー数(あとで記入),備考,投稿ID
          PY
          git add history.json data/daily_log.csv
          git commit -m "history" || true
          git pull --rebase || true
          git push
      - name: Notify failure to Slack
        if: failure()
        run: |
          pip install -q requests
          python src/notify.py ":rotating_light: 自動投稿でエラーが起きました(${{ github.event_name }})。 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
