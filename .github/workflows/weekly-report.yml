name: report
on:
  schedule:
    - cron: "0 0 * * 1,3,5"   # 月・水・金 9:00 JST (月曜=1週間の振り返り、水・金=投稿状況)
  workflow_dispatch:
    inputs:
      mode:
        description: "monday(1週間の振り返り) か midweek(投稿状況)。空なら曜日で自動"
        default: ""
permissions:
  contents: write
concurrency:
  group: reel-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests
      - run: python src/report.py
      - name: Save snapshot
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add data/views_snapshot.json
          git commit -m "views snapshot" || true
          git pull --rebase || true
          git push || true
      - name: Notify failure
        if: failure()
        run: |
          pip install -q requests
          python src/notify.py ":rotating_light: レポートの実行に失敗しました。 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
