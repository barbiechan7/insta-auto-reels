name: weekly-report
on:
  schedule:
    - cron: "0 0 * * 1"   # 毎週月曜 9:00 JST
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python src/report.py
      - name: Notify failure
        if: failure()
        run: |
          pip install -q requests
          python src/notify.py ":rotating_light: 週次レポートの実行に失敗しました。 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
